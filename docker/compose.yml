# ============================================================
#  本地多模态助手 · Docker 编排
#
#  两种 Ollama 模式（默认「直连」，无需下载任何东西）：
#
#   ① 直连模式（默认）—— 用宿主机已经装好的 Ollama
#        docker compose up -d
#
#   ② 自带模式 —— 在容器里再跑一个 Ollama（需先有 Ollama 镜像）
#        docker compose --profile bundled up -d
#
#  有 NVIDIA 显卡时叠加 GPU 覆盖文件：
#        docker compose -f compose.yml -f compose.gpu.yml up -d
#
#  模型不放在镜像里，而是挂载包内的 models 目录 —— 不在磁盘上存两份。
# ============================================================
name: local-multimodal

services:
  # ---------------- 界面与后端 ----------------
  app:
    # 由部署脚本按显卡情况写入 .env：
    #   有 N 卡 → local-multimodal-app:gpu （CUDA 版 torch，绘图走显卡）
    #   没有   → local-multimodal-app:latest（CPU 版，体积小）
    # 默认值保持 CPU 版，保证「不写 .env 直接 up」也能跑起来。
    image: ${APP_IMAGE:-local-multimodal-app:latest}
    build:
      context: ./build
      dockerfile: docker/Dockerfile.app
    container_name: mm-app
    restart: unless-stopped
    environment:
      # 直连模式指向宿主机；自带模式由 .env 覆盖为 http://ollama:11434
      MM_OLLAMA_URL: ${MM_OLLAMA_URL:-http://host.docker.internal:11434}
      MM_MODEL: ${MM_MODEL:-qwen3-vl:8b}
      MM_DATA_DIR: /data
      # 宿主机的 data 目录实际位置（由部署脚本写入 .env）。
      # 容器里点「打开文件夹」打不开宿主机资源管理器，用这个路径提示用户。
      MM_HOST_DATA_DIR: ${MM_HOST_DATA_DIR:-}
      TZ: Asia/Shanghai
    # 让 host.docker.internal 在 Linux 上也能解析到宿主机
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      # ⚠️⚠️ 前面必须写 127.0.0.1，**不能只写 "8000:8000"**。
      #    只写端口的话 Docker 会绑到 0.0.0.0（所有网卡）—— 在办公室/酒店这类共享网络上，
      #    同网段的人就能打开这个应用：不光能看你的记忆和会话，
      #    还能从 /api/config 读到高德 key。这跟"数据不出本机"的承诺是矛盾的。
      #    绑到 127.0.0.1 后只有本机能访问，界面照样正常用。
      #    （确实需要局域网访问再自己改回 0.0.0.0，但要清楚这意味着什么。）
      - "127.0.0.1:${APP_PORT:-8000}:8000"
    volumes:
      - ./data:/data                                  # 记忆库/会话/图片库/日志
      # 绘图模型。⚠️ 目录名故意取中性名（sd_model），换权重只要换内容、不用动这里 ——
      # 以前写的是 models/sd-turbo，一换模型就得改 compose，很容易漏改导致
      # 容器里挂了个不存在的路径（会静默变成"要去联网下载"）。
      # 2026-09-26 起内容为 **SDXL base 1.0（fp16，原生 1024）**：
      # 之前的 sd-turbo 是 SD2.1 蒸馏版，只能 guidance=0（CFG 关闭），
      # 提示词几乎不起作用（实测"橘猫坐窗台"画成河滩），negative_prompt 也失效。
      - ./models/sd_model:/opt/app/sd_model:ro
      - ./models/esrgan:/opt/app/esrgan:ro            # 超分模型
    shm_size: "2gb"                                   # 多模态推理需要较大共享内存

  # ---------------- 自带 Ollama（可选）----------------
  ollama:
    profiles: ["bundled"]                             # 默认不启动
    image: ${OLLAMA_IMAGE:-local-multimodal-ollama:latest}
    container_name: mm-ollama
    restart: unless-stopped
    environment:
      OLLAMA_HOST: 0.0.0.0
      OLLAMA_MODELS: /root/.ollama/models
      OLLAMA_KEEP_ALIVE: 30m                          # 模型常驻显存，避免反复加载
    volumes:
      # 直接挂载包内已下好的模型，零下载；Ollama 需要写权限（拉取/校验时）
      - ./models/ollama:/root/.ollama/models
    healthcheck:
      test: ["CMD-SHELL", "ollama list | grep -q qwen3-vl"]
      interval: 20s
      timeout: 15s
      retries: 30
      start_period: 30s
