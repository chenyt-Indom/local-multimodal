# ============================================================
#  本地多模态助手 · 完整版编排（自包含、完全离线）
#  单容器内含：Ollama 运行时 + Qwen3-VL 对话模型 + SD 绘图模型 + 超分模型 + 应用
#  不联网即可直接用；换台机器只需加载镜像再启动。
#
#  用法（在本文件所在目录执行）：
#    docker compose -f compose.full.yml up -d
#  有 NVIDIA 显卡想加速：
#    docker compose -f compose.full.yml -f compose.full.gpu.yml up -d
# ============================================================
name: local-multimodal-full

services:
  app:
    image: local-multimodal-full:latest
    build:
      context: ./build
      dockerfile: docker/Dockerfile.full
      additional_contexts:
        models: ./build/models        # 模型单独作为构建上下文传入
    container_name: mm-app
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai
      # Ollama 与后端同处一个容器，显式指向本机，避免 /data 里残留的旧配置干扰
      MM_OLLAMA_URL: http://127.0.0.1:11434
      MM_MODEL: qwen3-vl:8b
      MM_DATA_DIR: /data
    ports:
      - "8000:8000"                   # 应用界面
    volumes:
      - ./data:/data                  # 记忆库/会话/图片库/日志 全在这里
    shm_size: "2gb"                   # 多模态推理需要较大共享内存
